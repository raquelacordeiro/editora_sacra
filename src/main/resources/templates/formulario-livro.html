<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${tituloPagina} + ' | Editora Sacra'">Livro | Editora Sacra</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<header class="topbar"><a class="brand" th:href="@{/}">EDITORA <span>SACRA</span></a><nav><a th:href="@{/}">Início</a><a th:href="@{/livros}">Catálogo de livros</a></nav></header>

<main class="form-page">
    <a class="back-link" th:href="@{/livros}">← Voltar ao catálogo</a>
    <div class="form-card">
<p class="eyebrow">ACERVO EDITORA SACRA</p><h1 th:text="${tituloPagina}">Cadastrar livro</h1><p class="muted">Preencha os dados abaixo. Os campos marcados com * são obrigatórios.</p>
<form method="post" th:action="@{/livros/salvar}" th:object="${livro}" class="book-form">
<input type="hidden" th:field="*{idLivro}">
<label>Título *<input type="text" th:field="*{titulo}" required maxlength="255" placeholder="Título do livro"></label>
<label>Descrição<textarea th:field="*{descricao}" rows="4" placeholder="Resumo ou descrição do livro"></textarea></label>
<div class="form-grid">
    <label>
        ISBN
        <input type="text" th:field="*{isbn}" maxlength="50"
               placeholder="ISBN do livro">
    </label>

    <label>
        Categoria *
        <select th:field="*{categoria.idCategorias}" required>
            <option value="">Selecione uma categoria</option>
            <option th:each="categoria : ${categorias}"
                    th:value="${categoria.idCategorias}"
                    th:text="${categoria.nome}">
            </option>
        </select>
    </label>
</div>
<div class="form-grid"><label>
    Preço (R$) *
    <input type="number"
           th:field="*{preco}"
           required
           min="0"
           step="0.01">
</label><label>Estoque *<input type="number" th:field="*{estoque}" required min="0" step="1"></label></div>
<label>URL da imagem<input type="url" th:field="*{imagemUrl}" placeholder="https://... (opcional)"></label>
<div class="form-actions"><a class="button secondary" th:href="@{/livros}">Cancelar</a><button class="button primary" type="submit">Salvar livro</button></div>
</form></div></main><footer class="footer">Editora Sacra · Catálogo e gestão de acervo</footer>
</body></html>
